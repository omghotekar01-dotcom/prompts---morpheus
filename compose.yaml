services:
  morpheus:
    build:
      context: .
    image: morpheus:local
    container_name: morpheus
    init: true
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - morpheus-state:/data
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=512m
      - /run/morpheus-exec:rw,exec,nosuid,nodev,size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stop_grace_period: 20s

volumes:
  morpheus-state:
