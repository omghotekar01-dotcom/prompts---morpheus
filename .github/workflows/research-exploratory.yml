name: MORPHEUS Exploratory Research Campaign

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Exploratory workload size"
        required: true
        default: "standard"
        type: choice
        options:
          - smoke
          - standard

permissions:
  contents: read

concurrency:
  group: morpheus-research-${{ github.ref }}
  cancel-in-progress: false

jobs:
  exploratory-evidence:
    name: Exploratory / Ubuntu / measured-not-publication-grade
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install analysis dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Configure release core
        run: cmake -S core -B build/research -DCMAKE_BUILD_TYPE=Release

      - name: Build research harnesses
        run: cmake --build build/research --parallel 2

      - name: Initialize evidence directory and truth boundary
        shell: bash
        run: |
          mkdir -p research-output
          cat > research-output/TRUTH-BOUNDARY.txt <<'EOF'
          EVIDENCE_STATE=MEASURED_GITHUB_HOSTED_EXPLORATORY
          These measurements come from an ephemeral GitHub-hosted runner.
          They are reproducibility/exploration evidence, not publication-grade performance evidence.
          Do not use them for state-of-the-art, production-SLA, or hardware-general performance claims.
          Publication results require the frozen research protocol on controlled declared hardware.
          EOF

      - name: Capture machine and toolchain provenance
        shell: bash
        run: |
          {
            echo "git_sha=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            uname -a
            lscpu || true
            free -h || true
            g++ --version || true
            cmake --version || true
            python --version || true
          } > research-output/machine-provenance.txt 2>&1
          python benchmark/capture_machine_profile.py --output research-output/machine-profile.json

      - name: Select campaign parameters
        id: params
        shell: bash
        run: |
          if [[ "${{ inputs.profile }}" == "smoke" ]]; then
            echo "sizes=1000 10000" >> "$GITHUB_OUTPUT"
            echo "calibration_sizes=500 1000" >> "$GITHUB_OUTPUT"
            echo "ops=5000" >> "$GITHUB_OUTPUT"
            echo "repetitions=3" >> "$GITHUB_OUTPUT"
            echo "transition_repetitions=2" >> "$GITHUB_OUTPUT"
            echo "candidate_n=300" >> "$GITHUB_OUTPUT"
            echo "candidate_ops=300" >> "$GITHUB_OUTPUT"
            echo "candidate_repetitions=2" >> "$GITHUB_OUTPUT"
            echo "candidate_top=2" >> "$GITHUB_OUTPUT"
            echo "candidate_specs=research/workloads/point-heavy.yaml research/workloads/point-hotspot.yaml research/workloads/mixed-commerce.yaml" >> "$GITHUB_OUTPUT"
          else
            echo "sizes=1000 10000 100000" >> "$GITHUB_OUTPUT"
            # MutableSortedArrayIndex build uses the real generated incremental insertion path (O(n^2));
            # cap calibration scales rather than substituting a faster legacy bulk-load implementation.
            echo "calibration_sizes=1000 5000 10000" >> "$GITHUB_OUTPUT"
            echo "ops=30000" >> "$GITHUB_OUTPUT"
            echo "repetitions=10" >> "$GITHUB_OUTPUT"
            echo "transition_repetitions=5" >> "$GITHUB_OUTPUT"
            echo "candidate_n=2000" >> "$GITHUB_OUTPUT"
            echo "candidate_ops=2000" >> "$GITHUB_OUTPUT"
            echo "candidate_repetitions=5" >> "$GITHUB_OUTPUT"
            echo "candidate_top=3" >> "$GITHUB_OUTPUT"
            echo "candidate_specs=research/workloads/point-heavy.yaml research/workloads/point-sequential.yaml research/workloads/point-hotspot.yaml research/workloads/point-zipf.yaml research/workloads/ordered-analytics.yaml research/workloads/categorical-filter.yaml research/workloads/prefix-catalog.yaml research/workloads/mixed-commerce.yaml" >> "$GITHUB_OUTPUT"
          fi

      - name: Run implementation-bound target-machine calibration matrix
        shell: bash
        run: >-
          python benchmark/run_calibration_matrix.py
          build/research/morpheus_calibrate
          --sizes ${{ steps.params.outputs.calibration_sizes }}
          --seeds 1337 2027 9001
          --ops ${{ steps.params.outputs.ops }}
          --repetitions ${{ steps.params.outputs.repetitions }}
          --warmup 1
          --output-dir research-output/calibration

      - name: Evaluate calibration interpolation on held-out interior scales
        shell: bash
        run: >-
          python benchmark/analyze_calibration_surface.py
          research-output/calibration
          --output research-output/calibration/calibration-surface-evaluation.json

      - name: Run paired repository baseline matrix
        shell: bash
        run: >-
          python benchmark/run_baseline_matrix.py
          build/research/morpheus_baseline_bench
          --sizes ${{ steps.params.outputs.sizes }}
          --seeds 1337 2027 9001
          --ops ${{ steps.params.outputs.ops }}
          --repetitions ${{ steps.params.outputs.repetitions }}
          --warmup 1
          --output-dir research-output/baselines

      - name: Run optional modern specialist-container baseline matrix
        shell: bash
        run: >-
          python benchmark/run_specialist_baseline_matrix.py
          build/research/morpheus_specialist_baseline_bench
          --sizes ${{ steps.params.outputs.sizes }}
          --seeds 1337 2027 9001
          --ops ${{ steps.params.outputs.ops }}
          --repetitions ${{ steps.params.outputs.repetitions }}
          --warmup 1
          --output-dir research-output/specialist-baselines

      - name: Run generated-candidate prediction validation campaign
        shell: bash
        run: >-
          python benchmark/run_generated_candidate_validation.py
          ${{ steps.params.outputs.candidate_specs }}
          --output-dir research-output/generated-candidate-validation
          --top-candidates ${{ steps.params.outputs.candidate_top }}
          --record-count ${{ steps.params.outputs.candidate_n }}
          --ops ${{ steps.params.outputs.candidate_ops }}
          --repetitions ${{ steps.params.outputs.candidate_repetitions }}
          --warmup 1
          --max-candidates 4096
          --beam-width 128

      - name: Evaluate trace classifier on deterministic synthetic families
        shell: bash
        run: >-
          python benchmark/evaluate_access_trace_classifier.py
          --seeds 17,1337
          --sample-counts 1000,3000
          --domain-sizes 100,500
          --output research-output/access-trace-classifier-synthetic.json

      - name: Measure same-type version publication
        shell: bash
        run: |
          for n in ${{ steps.params.outputs.sizes }}; do
            build/research/morpheus_versioned_slot_bench \
              --readers 4 \
              --transitions 100 \
              --repetitions ${{ steps.params.outputs.transition_repetitions }} \
              --payload-values "$n" \
              > "research-output/versioned-slot-${n}.csv"
          done

      - name: Measure cross-type migration publication
        shell: bash
        run: |
          for n in ${{ steps.params.outputs.sizes }}; do
            build/research/morpheus_migration_publish_bench \
              --readers 4 \
              --transitions 50 \
              --repetitions ${{ steps.params.outputs.transition_repetitions }} \
              --payload-values "$n" \
              > "research-output/migration-publish-${n}.csv"
          done

      - name: Run bitmap representation sweep
        shell: bash
        run: >-
          python scripts/sweep_container_crossover.py
          build/research/morpheus_container_crossover_bench
          --cardinalities 512,1024,2048,4096,8192,16384,32768
          --seeds 1337,2027,9001
          --repetitions ${{ steps.params.outputs.repetitions }}
          --output research-output/container-crossover.csv

      - name: Analyze bitmap representation sweep
        shell: bash
        run: >-
          python scripts/analyze_container_crossover.py
          research-output/container-crossover.csv
          --expect-samples ${{ steps.params.outputs.repetitions }}
          --output research-output/container-crossover-summary.csv

      - name: Run ordered-tree deletion comparison
        shell: bash
        run: >-
          python scripts/sweep_ordered_tree_erase.py
          build/research/morpheus_ordered_tree_erase_bench
          --sizes 256,1024,4096,16384
          --seeds 1337,2027,9001
          --erase-count 32
          --repetitions ${{ steps.params.outputs.repetitions }}
          --output research-output/ordered-tree-erase.csv

      - name: Analyze ordered-tree deletion comparison
        shell: bash
        run: >-
          python scripts/analyze_ordered_tree_erase.py
          research-output/ordered-tree-erase.csv
          --expect-samples ${{ steps.params.outputs.repetitions }}
          --output research-output/ordered-tree-erase-summary.csv

      - name: Validate research evidence contracts
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib

          calibration = pathlib.Path("research-output/calibration")
          surface = json.loads((calibration / "calibration-surface-evaluation.json").read_text())
          assert surface["protocol"] == "morpheus-calibration-surface-evaluation-v1"
          assert surface["eligible_for_optimizer_automatic_promotion"] is False
          assert surface["evidence_state"] == "LEAVE_ONE_INTERIOR_SCALE_OUT_INTERPOLATION_EVALUATION_ON_SAME_MACHINE_MATRIX"

          classifier = json.loads(pathlib.Path("research-output/access-trace-classifier-synthetic.json").read_text())
          assert classifier["schema"] == "morpheus-access-trace-classifier-synthetic-evaluation-v1"
          assert classifier["case_count"] > 0
          assert classifier["eligible_for_runtime_automatic_promotion"] is False
          assert classifier["evidence_state"] == "SYNTHETIC_GENERATOR_CLASSIFICATION_EVALUATION_NOT_REAL_TRACE_VALIDATION"
          assert set(classifier["confusion"]) == {"uniform", "sequential", "hotspot", "zipf"}

          specialist = pathlib.Path("research-output/specialist-baselines")
          manifest = json.loads((specialist / "baseline_manifest.json").read_text())
          raw = json.loads((specialist / "raw_measurements.json").read_text())
          summary = json.loads((specialist / "statistical_summary.json").read_text())
          assert manifest["baseline_class"] == "OPTIONAL_MODERN_CPP_SPECIALIST_CONTAINERS"
          assert raw["availability_by_run"]
          assert summary["evidence_state"] == "ANALYZED_WHERE_SPECIALIST_ADAPTER_AVAILABLE"

          generated = pathlib.Path("research-output/generated-candidate-validation")
          campaign = json.loads((generated / "manifest.json").read_text())
          index = json.loads((generated / "evidence-index.json").read_text())
          assert campaign["schema"] == "morpheus-generated-candidate-validation-campaign-v1"
          assert campaign["distribution_protocol"] == "morpheus-access-distribution-v1"
          assert campaign["validation_point_count"] >= 2
          assert index["evidence_state"] == "CONTENT_HASHED_LOCAL_RESEARCH_PACKAGE"
          workloads = {item["workload_name"]: item for item in campaign["workloads"]}
          assert "point_hotspot_validation" in workloads
          hotspot = workloads["point_hotspot_validation"]
          assert hotspot["distribution_protocol"] == "morpheus-access-distribution-v1"
          assert hotspot["query_distributions"][0]["kind"] == "hotspot"
          assert hotspot["query_distributions"][0]["hotspot_fraction"] == 0.1
          assert hotspot["query_distributions"][0]["hotspot_probability"] == 0.8
          for workload in campaign["workloads"]:
              for run in workload["candidate_runs"]:
                  assert run["distribution_protocol"] == workload["distribution_protocol"]
          PY

      - name: Validate transition reader integrity
        shell: bash
        run: |
          python - <<'PY'
          import csv, glob
          for pattern in ("research-output/versioned-slot-*.csv", "research-output/migration-publish-*.csv"):
              paths = glob.glob(pattern)
              assert paths, pattern
              for path in paths:
                  rows = list(csv.DictReader(open(path, newline="")))
                  assert rows, path
                  assert all(int(row["invalid_reads"]) == 0 for row in rows), path
                  assert all(int(row["reads"]) > 0 for row in rows), path
          PY

      - name: Capture file hashes
        shell: bash
        run: |
          find research-output -type f -print0 | sort -z | xargs -0 sha256sum > research-output/SHA256SUMS.txt

      - name: Upload exploratory evidence package
        uses: actions/upload-artifact@v4
        with:
          name: morpheus-exploratory-${{ github.sha }}-${{ inputs.profile }}
          path: research-output/
          if-no-files-found: error
          retention-days: 30
