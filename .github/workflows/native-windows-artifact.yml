name: MORPHEUS Windows Native Artifact

on:
  push:
    branches:
      - "codex/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: morpheus-native-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test Windows C/C++ engines
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Configure C and C++ core
        run: cmake -S core -B build/core-windows -A x64

      - name: Build core and native engines
        run: cmake --build build/core-windows --config Release --parallel 2

      - name: Run core tests
        run: ctest --test-dir build/core-windows -C Release --output-on-failure

      - name: Package native engines with SHA-256 manifest
        shell: pwsh
        run: |
          $out = "dist/native/windows-x64"
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          $names = @(
            "morpheus_native_search.exe",
            "morpheus_csv_profile.exe",
            "morpheus_empirical_cost.exe",
            "morpheus_native_capabilities.exe"
          )
          $files = @()
          foreach ($name in $names) {
            $source = Join-Path "build/core-windows/Release" $name
            if (-not (Test-Path $source)) { throw "C++ executable missing: $source" }
            Copy-Item -LiteralPath $source -Destination (Join-Path $out $name) -ErrorAction Stop
            $sha = (Get-FileHash -LiteralPath (Join-Path $out $name) -Algorithm SHA256).Hash.ToLowerInvariant()
            $files += @{ name = $name; sha256 = $sha }
          }
          $manifest = @{
            protocol = "MORPHEUS_WINDOWS_NATIVE_V1"
            source_commit = (git rev-parse HEAD).Trim()
            files = $files
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $out "SHA256.json") -Encoding utf8

      - name: Publish commit-bound native engines
        uses: actions/upload-artifact@v4
        with:
          name: morpheus-native-windows-x64-${{ github.sha }}
          path: dist/native/windows-x64/
          if-no-files-found: error
          retention-days: 21
