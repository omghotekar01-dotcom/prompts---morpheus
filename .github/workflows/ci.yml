name: MORPHEUS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: morpheus-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend / Ubuntu / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run tests
        working-directory: backend
        run: pytest -q

  backend-windows:
    name: Backend / Windows / Python 3.14 + MSVC
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run tests with native MSVC available
        working-directory: backend
        env:
          MORPHEUS_CXX: cl.exe
        run: python -m pytest -q

  core:
    name: Core / Ubuntu / C++20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S core -B build/core -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/core --parallel 2
      - name: Test
        run: ctest --test-dir build/core --output-on-failure
      - name: Calibration matrix smoke
        run: >-
          python3 benchmark/run_calibration_matrix.py
          build/core/morpheus_calibrate
          --sizes 500
          --seeds 1337
          --ops 1000
          --repetitions 2
          --warmup 0
          --output-dir /tmp/morpheus-calibration-matrix
      - name: Distribution-bound calibration matrix smoke
        run: >-
          python3 benchmark/run_distribution_calibration_matrix.py
          build/core/morpheus_distribution_calibrate
          --sizes 500
          --seeds 1337
          --distributions uniform sequential hotspot zipf
          --ops 1000
          --repetitions 2
          --warmup 0
          --output-dir /tmp/morpheus-distribution-calibration-matrix
      - name: Validate distribution calibration evidence contract
        run: >-
          python3 -c "import json,pathlib; root=pathlib.Path('/tmp/morpheus-distribution-calibration-matrix'); manifest=json.loads((root/'manifest.json').read_text()); runs=manifest['runs']; assert manifest['protocol']=='morpheus-distribution-calibration-matrix-v1'; assert manifest['distribution_protocol']=='morpheus-access-distribution-v1'; assert manifest['evidence_state']=='CONTENT_HASHED_DISTRIBUTION_BOUND_PRIMITIVE_CALIBRATION_MATRIX'; assert manifest['distributions']==['hotspot','sequential','uniform','zipf']; assert len(runs)==1; assert set(runs[0]['distributions'])=={'uniform','sequential','hotspot','zipf'}; assert runs[0]['measurement_count']>0"
      - name: Paired standard-library baseline matrix smoke
        run: >-
          python3 benchmark/run_baseline_matrix.py
          build/core/morpheus_baseline_bench
          --sizes 500 1000
          --seeds 1337 2027
          --ops 1000
          --repetitions 2
          --warmup 0
          --output-dir /tmp/morpheus-baseline-matrix
      - name: Optional specialist-container baseline matrix smoke
        run: >-
          python3 benchmark/run_specialist_baseline_matrix.py
          build/core/morpheus_specialist_baseline_bench
          --sizes 500 1000
          --seeds 1337 2027
          --ops 1000
          --repetitions 2
          --warmup 0
          --output-dir /tmp/morpheus-specialist-baseline-matrix
      - name: Validate specialist baseline evidence contract
        run: >-
          python3 -c "import json,pathlib; root=pathlib.Path('/tmp/morpheus-specialist-baseline-matrix'); index=json.loads((root/'evidence_index.json').read_text()); manifest=json.loads((root/'baseline_manifest.json').read_text()); raw=json.loads((root/'raw_measurements.json').read_text()); summary=json.loads((root/'statistical_summary.json').read_text()); assert index['schema']=='morpheus-specialist-baseline-evidence-index-v1'; assert manifest['baseline_class']=='OPTIONAL_MODERN_CPP_SPECIALIST_CONTAINERS'; assert len(raw['runs'])==4; assert raw['availability_by_run']; assert summary['evidence_state']=='ANALYZED_WHERE_SPECIALIST_ADAPTER_AVAILABLE'"
      - name: Adaptive bitmap threshold sweep smoke
        run: >-
          python3 scripts/sweep_bitmap_benchmark.py
          build/core/morpheus_compressed_bitmap_bench
          --cardinalities 2048,4095,4096,4097,8192
          --repetitions 2
          --seeds 2
          --seed-base 1337
          --output /tmp/morpheus-bitmap-sweep.csv
      - name: Analyze adaptive bitmap sweep
        run: >-
          python3 scripts/analyze_bitmap_sweep.py
          /tmp/morpheus-bitmap-sweep.csv
          --expect-samples 2
          --output /tmp/morpheus-bitmap-summary.csv
      - name: Validate adaptive bitmap sweep artifacts
        run: >-
          python3 -c "import csv, pathlib; raw=list(csv.DictReader(pathlib.Path('/tmp/morpheus-bitmap-sweep.csv').open())); summary=list(csv.DictReader(pathlib.Path('/tmp/morpheus-bitmap-summary.csv').open())); assert len(raw)==40, len(raw); assert len(summary)==20, len(summary); assert {r['operation'] for r in raw}=={'intersection','union','contains','materialize'}; assert {r['operation'] for r in summary}=={'intersection','union','contains','materialize'}; assert {int(r['samples']) for r in summary}=={2}"
      - name: Sparse-dense container crossover sweep smoke
        run: >-
          python3 scripts/sweep_container_crossover.py
          build/core/morpheus_container_crossover_bench
          --cardinalities 2048,4096,8192
          --seeds 1337,7331
          --repetitions 2
          --output /tmp/morpheus-container-crossover.csv
      - name: Analyze sparse-dense container crossover
        run: >-
          python3 scripts/analyze_container_crossover.py
          /tmp/morpheus-container-crossover.csv
          --expect-samples 2
          --output /tmp/morpheus-container-crossover-summary.csv
      - name: Derive conservative crossover candidates
        run: >-
          python3 scripts/recommend_container_thresholds.py
          /tmp/morpheus-container-crossover.csv
          --expect-samples 2
          --margin-pct 5
          --consecutive 2
          --output /tmp/morpheus-container-threshold-candidates.csv
      - name: Validate sparse-dense crossover artifacts
        run: >-
          python3 -c "import csv, pathlib; raw=list(csv.DictReader(pathlib.Path('/tmp/morpheus-container-crossover.csv').open())); summary=list(csv.DictReader(pathlib.Path('/tmp/morpheus-container-crossover-summary.csv').open())); candidates=list(csv.DictReader(pathlib.Path('/tmp/morpheus-container-threshold-candidates.csv').open())); assert len(raw)==48, len(raw); assert len(summary)==12, len(summary); assert len(candidates)==4, len(candidates); assert {r['representation'] for r in raw}=={'sparse','dense'}; assert {r['operation'] for r in summary}=={'intersection','union','contains','materialize'}; assert {int(r['samples']) for r in summary}=={2}; assert {r['winner'] for r in summary} <= {'sparse','dense','tie'}; assert {r['operation'] for r in candidates}=={'intersection','union','contains','materialize'}; assert {r['status'] for r in candidates} <= {'candidate','no_stable_candidate'}"
      - name: Ordered-tree erase comparison sweep smoke
        run: >-
          python3 scripts/sweep_ordered_tree_erase.py
          build/core/morpheus_ordered_tree_erase_bench
          --sizes 256,512
          --seeds 1337,7331
          --erase-count 8
          --repetitions 1
          --output /tmp/morpheus-ordered-tree-erase.csv
      - name: Analyze ordered-tree erase comparison
        run: >-
          python3 scripts/analyze_ordered_tree_erase.py
          /tmp/morpheus-ordered-tree-erase.csv
          --expect-samples 2
          --output /tmp/morpheus-ordered-tree-erase-summary.csv
      - name: Validate ordered-tree erase artifacts
        run: >-
          python3 -c "import csv, pathlib; raw=list(csv.DictReader(pathlib.Path('/tmp/morpheus-ordered-tree-erase.csv').open())); summary=list(csv.DictReader(pathlib.Path('/tmp/morpheus-ordered-tree-erase-summary.csv').open())); assert len(raw)==12, len(raw); assert len(summary)==2, len(summary); assert {r['implementation'] for r in raw}=={'ordered_tree_rebuild','bplus_tree_rebalanced','std_map'}; assert {int(r['samples']) for r in summary}=={2}; assert {int(r['erase_count']) for r in summary}=={8}; assert all(float(r['rebalanced_over_legacy_ratio']) >= 0 for r in summary)"
      - name: Native version-switch concurrency smoke
        run: >-
          build/core/morpheus_versioned_slot_bench
          --readers 4
          --transitions 100
          --repetitions 2
          --payload-values 1024
          > /tmp/morpheus-versioned-slot.csv
      - name: Validate native version-switch smoke
        run: >-
          python3 -c "import csv, pathlib; rows=list(csv.DictReader(pathlib.Path('/tmp/morpheus-versioned-slot.csv').open())); assert len(rows)==2, len(rows); assert all(int(r['invalid_reads'])==0 for r in rows); assert all(int(r['reads'])>0 for r in rows); assert all(int(r['snapshot_capture_ns_per'])>=0 and int(r['shadow_rebuild_ns_per'])>=0 and int(r['activate_ns_per'])>=0 and int(r['rollback_ns_per'])>=0 for r in rows)"
      - name: Cross-type migration publication smoke
        run: >-
          build/core/morpheus_migration_publish_bench
          --readers 4
          --transitions 60
          --repetitions 2
          --payload-values 512
          > /tmp/morpheus-migration-publish.csv
      - name: Validate cross-type migration publication smoke
        run: >-
          python3 -c "import csv, pathlib; rows=list(csv.DictReader(pathlib.Path('/tmp/morpheus-migration-publish.csv').open())); assert len(rows)==2, len(rows); assert all(int(r['invalid_reads'])==0 for r in rows); assert all(int(r['reads'])>0 for r in rows); assert all(int(r['migrate_validate_activate_ns_per'])>0 and int(r['rollback_ns_per'])>=0 for r in rows)"

  core-windows:
    name: Core / Windows / MSVC C++20
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S core -B build/core-windows -A x64
      - name: Build
        run: cmake --build build/core-windows --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build/core-windows -C Release --output-on-failure

  core-sanitizers:
    name: Core / ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure sanitizer build
        run: cmake -S core -B build/core-sanitized -DCMAKE_BUILD_TYPE=Debug -DMORPHEUS_ENABLE_SANITIZERS=ON
      - name: Build sanitizer targets
        run: cmake --build build/core-sanitized --parallel 2
      - name: Run sanitizer tests
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build/core-sanitized --output-on-failure

  frontend:
    name: Frontend / React TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Production build
        working-directory: frontend
        run: npm run build
