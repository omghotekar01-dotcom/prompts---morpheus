name: MORPHEUS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run tests
        working-directory: backend
        run: pytest -q

  core:
    name: Core / C++20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S core -B build/core -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/core --parallel 2
      - name: Test
        run: ctest --test-dir build/core --output-on-failure
      - name: Calibration matrix smoke
        run: >-
          python3 benchmark/run_calibration_matrix.py
          build/core/morpheus_calibrate
          --sizes 500
          --seeds 1337
          --ops 1000
          --repetitions 2
          --warmup 0
          --output-dir /tmp/morpheus-calibration-matrix

  core-sanitizers:
    name: Core / ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure sanitizer build
        run: cmake -S core -B build/core-sanitized -DCMAKE_BUILD_TYPE=Debug -DMORPHEUS_ENABLE_SANITIZERS=ON
      - name: Build sanitizer targets
        run: cmake --build build/core-sanitized --parallel 2
      - name: Run sanitizer tests
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build/core-sanitized --output-on-failure

  frontend:
    name: Frontend / React TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Production build
        working-directory: frontend
        run: npm run build
