name: MORPHEUS Review Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "core/include/**"
      - "Dockerfile"
      - ".github/workflows/review-smoke.yml"

permissions:
  contents: read

concurrency:
  group: morpheus-review-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review-smoke:
    name: Review / end-to-end smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run targeted generated-artifact gates
        working-directory: backend
        run: |
          pytest -q \
            tests/test_verifier.py::test_local_compile_gate_accepts_generated_cpp20_when_compiler_exists \
            tests/test_behavior_verifier.py::test_point_only_behavior_gate_executes_when_compiler_exists \
            tests/test_evidence_api.py::test_full_artifact_gate_persists_compile_and_behavior_manifest

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build review frontend
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Build packaged review image
        run: docker build -t morpheus:review-smoke .

      - name: Start packaged review image
        run: |
          docker run -d --name morpheus-review-smoke \
            -p 127.0.0.1:18000:8000 \
            --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=512m \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            -e MORPHEUS_API_KEY=review-smoke-key-0123456789abcdef \
            -e MORPHEUS_RATE_LIMIT_PER_MINUTE=120 \
            morpheus:review-smoke

      - name: Verify packaged browser-to-engine path
        run: |
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:18000/api/health >/tmp/health.json; then
              cat /tmp/health.json
              break
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:18000/api/health >/dev/null

          python3 - <<'PY'
          import json
          from pathlib import Path

          spec = """version: mws-0.1
          name: review_smoke_point_lookup
          record_count: 1000
          fields:
            - name: id
              type: uint64
              cardinality: 1000
          queries:
            - kind: point_lookup
              field: id
              weight: 1.0
          constraints:
            memory_mb: 16
          """.replace("          ", "").strip()

          Path("/tmp/review-verify-request.json").write_text(
              json.dumps({"spec_text": spec}),
              encoding="utf-8",
          )
          PY

          curl --fail --silent \
            -H 'X-Morpheus-Key: review-smoke-key-0123456789abcdef' \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/review-verify-request.json \
            http://127.0.0.1:18000/api/artifact/verify/full \
            >/tmp/review-verification.json

          cat /tmp/review-verification.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("/tmp/review-verification.json").read_text())
          verification = payload["verification"]
          assert verification["success"] is True, verification
          assert verification["compile_gate"]["evidence_state"] == "COMPILED_LOCAL_TOOLCHAIN"
          assert verification["behavior_gate"]["evidence_state"] == "STATEFUL_DIFFERENTIAL_VERIFIED_LOCAL_TOOLCHAIN"
          assert verification["behavior_gate"]["checks"] > 0
          PY

          curl --fail --silent http://127.0.0.1:18000/ | grep -q '<div id="root"></div>'

      - name: Show packaged logs on failure
        if: failure()
        run: docker logs morpheus-review-smoke || true

      - name: Stop packaged review image
        if: always()
        run: docker rm -f morpheus-review-smoke >/dev/null 2>&1 || true
