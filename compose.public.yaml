services:
  morpheus:
    build:
      context: .
    image: morpheus:local
    container_name: morpheus
    init: true
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "8000"
    volumes:
      - morpheus-state:/data
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=512m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stop_grace_period: 20s

  caddy:
    image: caddy:2.11.6-alpine
    container_name: morpheus-caddy
    restart: unless-stopped
    depends_on:
      morpheus:
        condition: service_healthy
    environment:
      MORPHEUS_DOMAIN: ${MORPHEUS_DOMAIN:?Set MORPHEUS_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy:/etc/caddy:ro
      - caddy-data:/data
      - caddy-config:/config
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

volumes:
  morpheus-state:
  caddy-data:
  caddy-config:
